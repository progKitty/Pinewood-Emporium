version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pinewood
      POSTGRES_USER: pinewood_user
      POSTGRES_PASSWORD: pinewood_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://pinewood_user:pinewood_password@db:5432/pinewood
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: bun run dev --host 0.0.0.0 --port 3000
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
